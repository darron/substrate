[workspace]
resolver = "3"
members = [
  "egress-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Pin to v1.40.2 commit SHA
# When changing the SDK version, the version of Envoy in the cmd/dataplane/envoy/Dockerfile SHOULD match.
# SDK version SHOULD NOT be newer than Envoy's in the dataplane image, as extensions will not load if they use
# APIs not supported by the Envoy binary in the image.
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", rev = "b2d89e0ae53916f28770771fbdd49c5c99c5c5a2" }
rapidhash = "4.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thread_local = "1.1"
